<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valluvam — திருக்குறள்</title>
<meta name="description" content="Read all 1330 couplets of the Thirukkural with English translation and meaning.">
<meta name="theme-color" content="#1F1B16">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;600;700;800&family=Kavivanar&family=Kalam:wght@400;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="coverScreen">
  <div class="cover-topbar">
    <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode">
      <svg id="themeIconSun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="themeIconMoon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
    <button id="searchToggle" class="icon-btn" aria-label="Search">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>

  <div class="cover-hero">
    <div class="cover-title-block">
      <div class="ornament-corner top-left" aria-hidden="true">
        <svg width="30" height="46" viewBox="0 0 30 46" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 44V10"/><path d="M6 18c0-5 4-8 12-9-1.5 5-4 8-12 9z"/><path d="M6 28c0-4-3-6.5-9-7 1.2 4 3 6.5 9 7z"/></svg>
      </div>
      <h1 class="cover-title">திருக்குறள்</h1>
      <p class="cover-subtitle">The Eternal Wisdom</p>
    </div>

    <div class="portrait-frame" id="portraitFrame">
      <img src="assets/portrait.png" alt="Thiruvalluvar" id="portraitImg">
      <div class="portrait-placeholder" id="portraitPlaceholder">
        <svg width="70" height="70" viewBox="0 0 70 70" fill="none" stroke="currentColor" stroke-width="2"><circle cx="35" cy="26" r="16"/><path d="M8 66c0-15 12-24 27-24s27 9 27 24"/></svg>
        <span>Portrait coming soon</span>
      </div>
    </div>
  </div>

  <div class="section-list">
    <button class="section-row" data-section="1" style="--sec-bg: var(--sec1-bg); --sec-text: var(--sec1-text); --sec-line: var(--sec1-line);">
      <span class="sec-num">1</span>
      <span class="sec-info">
        <span class="sec-ta">அறத்துப்பால்</span>
        <span class="sec-translit">Arathuppaal</span>
        <span class="sec-desc">On Virtue (Aram)</span>
      </span>
      <span class="sec-range"><i></i>1 – 38</span>
    </button>
    <button class="section-row" data-section="2" style="--sec-bg: var(--sec2-bg); --sec-text: var(--sec2-text); --sec-line: var(--sec2-line);">
      <span class="sec-num">2</span>
      <span class="sec-info">
        <span class="sec-ta">பொருட்பால்</span>
        <span class="sec-translit">Porulpaal</span>
        <span class="sec-desc">On Wealth (Porul)</span>
      </span>
      <span class="sec-range"><i></i>39 – 108</span>
    </button>
    <button class="section-row" data-section="3" style="--sec-bg: var(--sec3-bg); --sec-text: var(--sec3-text); --sec-line: var(--sec3-line);">
      <span class="sec-num">3</span>
      <span class="sec-info">
        <span class="sec-ta">காமத்துப்பால்</span>
        <span class="sec-translit">Kaamathuppaal</span>
        <span class="sec-desc">On Love (Inbam)</span>
      </span>
      <span class="sec-range"><i></i>109 – 133</span>
    </button>
  </div>

  <div class="cover-bottom">
    <span class="cover-bottom-line"></span>
    Virtue
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.35-9.5-8.8C.7 7.9 2.4 4.5 5.8 4.5c2 0 3.4 1.1 4.2 2.4C10.8 5.6 12.2 4.5 14.2 4.5c3.4 0 5.1 3.4 3.3 6.7C19 15.65 12 20 12 20z"/></svg>
    Wealth
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.35-9.5-8.8C.7 7.9 2.4 4.5 5.8 4.5c2 0 3.4 1.1 4.2 2.4C10.8 5.6 12.2 4.5 14.2 4.5c3.4 0 5.1 3.4 3.3 6.7C19 15.65 12 20 12 20z"/></svg>
    Love
    <span class="cover-bottom-line"></span>
  </div>

  <div class="ornament-corner bottom-left" aria-hidden="true">
    <svg width="34" height="52" viewBox="0 0 34 52" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 50V6"/><path d="M8 16c0-6 5-9 14-10-1.7 6-5 9-14 10z"/><path d="M8 28c0-5-4-7.5-10-8 1.4 5 4 7.5 10 8z"/><path d="M8 38c0-4.5-3.5-6.5-8.5-7 1.2 4.3 3.5 6.5 8.5 7z"/></svg>
  </div>
</div>

<div id="searchScreen" class="hidden">
  <header class="app-header">
    <div class="header-row">
      <button id="searchBackBtn" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="search-bar" style="flex:1; margin:0 0 0 0.5rem;">
        <input id="searchInput" type="search" placeholder="Search by word, number, or meaning…" autocomplete="off">
      </div>
    </div>
  </header>
  <main id="searchResults"></main>
</div>

<div id="cardScreen" class="hidden">
  <button id="cardBackBtn" class="card-back-btn" aria-label="Back to list">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    <span>Back</span>
  </button>
  <div id="flipStage" class="flip-stage">
    <article id="kuralCard" class="kural-journal-card"></article>
  </div>
  <div class="swipe-hint">← swipe for next kural →</div>
</div>

<script src="app.js"></script>
</body>
</html>
